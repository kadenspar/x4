name: Website build and privacy audit

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build production website
        run: npm run build
      - name: Check privacy regression
        run: python3 scripts/check-web-privacy.py
